name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:  # also allow manual runs from the Actions tab

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: code-search

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
        run: |
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deploy to EC2 via SSM
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          INSTANCE: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          # commands the server runs: pull the new image, replace the container, health-check it
          cat > params.json <<JSON
          {"commands": [
            "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY",
            "docker pull $IMAGE",
            "docker rm -f code-search || true",
            "docker run -d --name code-search --restart unless-stopped -p 80:7860 -v /opt/code-search/data:/app/data $IMAGE",
            "for i in \$(seq 1 30); do curl -sf localhost/health && break; sleep 2; done",
            "curl -sf localhost/health",
            "docker image prune -af"
          ]}
          JSON
          CMD_ID=$(aws ssm send-command --instance-ids "$INSTANCE" \
            --document-name AWS-RunShellScript --comment "deploy ${{ github.sha }}" \
            --parameters file://params.json --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"
          # wait up to 10 minutes for the server to finish
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" \
            --query '{status: Status, output: StandardOutputContent, errors: StandardErrorContent}'
          test "$STATUS" = "Success"
